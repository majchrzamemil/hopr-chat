[package]
name = "hopr-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustyline = { version = "14", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
edgli = { git = "https://github.com/hoprnet/edge-client.git", branch = "release/4.1", default-features = false, features = ["blokli"] }
serde_yaml = "0.9"
toml = "0.8"
hex = "0.4"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"

[features]
# rustyline line-mode frontend, selected at runtime with --cli
cli = ["dep:rustyline"]

[workspace]
members = [".", "app/src-tauri"]
resolver = "2"

# Dependency debug info made the dev build ~13 GB; line tables keep backtraces readable.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
