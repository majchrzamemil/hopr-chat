[package]
name = "hopr-chat"
version = "0.1.0"
edition = "2021"
description = "Anonymous P2P chat over HOPR sessions"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
edgli = { git = "https://github.com/hoprnet/edge-client.git", rev = "b6614471abb975959060e86df1b0c28ce8305d07", default-features = false, features = ["blokli"] }
hoprd = { git = "https://github.com/hoprnet/hoprd.git", rev = "227e0c2d787cf77d040c203e75a3e4e45e1821b0", default-features = false, features = ["runtime-tokio", "transport-quic", "session-server"], optional = true }
serde_yaml = "0.9"
toml = "0.8"
hex = "0.4"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["embedded"]
# hoprd runs inside this process; without it production mode spawns a hoprd binary
embedded = ["dep:hoprd", "dep:tracing-subscriber"]

[workspace]
members = [".", "app/src-tauri"]
resolver = "2"

# Dependency debug info made the dev build ~13 GB; line tables keep backtraces readable.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# edgli follows hoprnet `master`, hoprd pins a rev: one hopr-lib so their types are shared.
# `www.` makes it a distinct source, cargo refuses patches pointing at the patched URL.
[patch."https://github.com/hoprnet/hoprnet"]
hopr-lib = { git = "https://www.github.com/hoprnet/hoprnet", rev = "77f0e221a1bfb3964f7f4f492706baa91418697f" }
hopr-utils-session = { git = "https://www.github.com/hoprnet/hoprnet", rev = "77f0e221a1bfb3964f7f4f492706baa91418697f" }
